<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book Vardi - Premium School Stationery, Planners, Writing Supplies, and Creative Essentials." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Book Vardi | Premium School Stationery & Supplies</title>
    <script>
      (function() {
        if (window.location.hostname.endsWith('.vercel.app')) {
          var target = 'https://www.bookvardi.in' + window.location.pathname + window.location.search + window.location.hash;
          window.location.replace(target);
        }

        // Safe storage shim to prevent "Access is denied for this document" DOMException in private/webview mode
        var memStore = {};
        var createShim = function() {
          return {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; },
            setItem: function(k, v) { memStore[k] = String(v); },
            removeItem: function(k) { delete memStore[k]; },
            clear: function() { memStore = {}; },
            key: function(i) { return Object.keys(memStore)[i] || null; },
            get length() { return Object.keys(memStore).length; }
          };
        };

        ['localStorage', 'sessionStorage'].forEach(function(storageName) {
          var isWorking = false;
          try {
            var st = window[storageName];
            if (st) {
              var tk = '__bv_check__';
              st.setItem(tk, '1');
              st.removeItem(tk);
              isWorking = true;
            }
          } catch (e) {
            isWorking = false;
          }

          if (!isWorking) {
            var shim = createShim();
            try {
              Object.defineProperty(window, storageName, {
                get: function() { return shim; },
                set: function() {},
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              try {
                window[storageName] = shim;
              } catch (e2) {}
            }
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
